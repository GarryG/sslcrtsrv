[metadata]
name = sslcrtsrv
# Single source of truth: src/sslcrtsrv/__init__.py's __version__ - the same
# value the client itself imports (see client.py's `update` command, which
# compares this against the server's catalog). setuptools reads it via a
# static AST parse of that file (no import needed), so this always matches
# what actually gets installed - see debian/rules for the matching check
# that keeps debian/changelog's version from silently drifting away from it.
version = attr: sslcrtsrv.__version__
description = SSL certificate management client/server tools
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
# Lower-bound pins only (internal/security/SECURITY_FINDINGS.md finding #22) - no upper
# bounds, since this project doesn't control the Debian-packaged runtime
# environment tightly enough to safely cap versions without risking a
# future distro release's newer packages failing to satisfy an overly
# narrow range. Versions match what's actually tested against.
#
# cryptography's floor is >=49, not just "whatever happened to be
# installed" (41.0.5, this dev environment's version until this pass) -
# running `pip-audit` against that version turned up several known CVEs
# (fixed between 41.0.6 and 49.0.0, e.g. GHSA-537c-gmf6-5ccf) before this
# pin was ever added. Verified compatible by upgrading to 50.0.1 in this
# environment and re-running the full test suite (91/91 passed) - the
# floor is set to 49 rather than the exact tested 50.0.1 so a distro's
# slightly-older-but-still-patched package can still satisfy it.
install_requires =
    cryptography>=49

[options.packages.find]
where = src

[options.extras_require]
server =
    sqlalchemy>=2.0
    alembic>=1.19
    textual>=8.2
    pytz>=2025.2
    rich>=15.0
mysql =
    PyMySQL>=1.0
postgresql =
    psycopg2-binary>=2.9
acme =
    josepy>=2.2
maxmind =
    maxminddb>=2.2
ip2location =
    IP2Location>=8.0

[options.entry_points]
console_scripts =
    scs-client = sslcrtsrv.client:main
    scs-server = sslcrtsrv.server:main
    scs-crtmanager = sslcrtsrv.crtmanager:main
    scs-cltmanager = sslcrtsrv.cltmanager:main
    scs-crtrequest = sslcrtsrv.crtrequest:main
    scs-admintui = sslcrtsrv.admintui.__main__:main
    scs-dbmigrate = sslcrtsrv.dbmigrate:main
    scs-acme-server = sslcrtsrv.acme_server:main

[options.package_data]
sslcrtsrv.admintui = app.tcss
